<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Ian Pedersen</title>
<meta name="description" content="Ian Pedersen — essays and writing">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>

<header class="hero hero-compact">
  <div class="wrap">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="background.html">Background</a>
      <a href="projects.html">Projects</a>
      <a href="writing.html" class="nav-current">Writing</a>
    </nav>
    <h1>Writing</h1>
  </div>
</header>

<main class="wrap">
  <section id="published-works">
    <div class="empty-state">
      <p>I publish my essays on Substack.</p>
      <a class="substack-link" href="https://ianpedersen2.substack.com" target="_blank" rel="noopener">Read on Substack &rarr;</a>
    </div>

    <div id="recent-posts" class="grid recent-posts" hidden></div>
  </section>
</main>

<footer class="wrap">
  <p>&copy; <span id="year"></span> Ian Pedersen</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  fetch('data/substack-posts.json')
    .then(res => res.ok ? res.json() : [])
    .then(posts => {
      if (!posts || !posts.length) return;
      const container = document.getElementById('recent-posts');
      container.innerHTML = posts.map(post => {
        const date = post.pub_date
          ? new Date(post.pub_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '';
        return `
          <article class="card post-card">
            <p class="post-date">${date}</p>
            <h3><a href="${post.url}" target="_blank" rel="noopener">${escapeHtml(post.title)}</a></h3>
            <p>${escapeHtml(post.excerpt)}</p>
          </article>
        `;
      }).join('');
      container.hidden = false;
    })
    .catch(() => {});
</script>
</body>
</html>
