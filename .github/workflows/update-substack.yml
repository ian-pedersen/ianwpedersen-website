name: Update Substack posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Substack posts
        run: python scripts/fetch_substack_posts.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/substack-posts.json; then
            echo "No changes to commit."
          else
            git add data/substack-posts.json
            git commit -m "Update Substack posts"
            git push
          fi
