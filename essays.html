<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essays — Ian Pedersen</title>
<meta name="description" content="Ian Pedersen — essays and writing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <div class="brand">
      <img src="images/headshot.jpg" alt="Ian Pedersen">
      <span>Ian Pedersen</span>
    </div>
    <nav class="nav mono">
      <a href="index.html" class="c-rust">Home</a>
      <a href="essays.html" class="current c-maroon">Essays</a>
      <a href="projects.html" class="c-ochre">Projects</a>
      <a href="background.html" class="c-amber">CV</a>
    </nav>
  </header>

  <div class="page-title">
    <h1 class="c-maroon">Essays</h1>
  </div>
</div>

<div class="divider"><div class="wrap"></div></div>
<div class="wrap">
  <div class="essays-body">
    <p class="intro">I publish my essays on Substack.</p>
    <a href="https://ianpedersen2.substack.com" target="_blank" rel="noopener" class="pill c-maroon">
      <span class="mono">Read on Substack &rarr;</span>
    </a>

    <div id="recent-posts" class="recent-posts" hidden>
      <p class="recent-posts-label mono">Recent posts</p>
      <div id="recent-posts-list"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links mono">
      <a href="mailto:ian_pedersen@berkeley.edu">Email</a>
      <a href="https://www.linkedin.com/in/ianpedersen2" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <p class="copyright">&copy; Ian Pedersen <span id="year"></span>. All rights reserved.</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  fetch('data/substack-posts.json')
    .then(res => res.ok ? res.json() : [])
    .then(posts => {
      if (!posts || !posts.length) return;
      const container = document.getElementById('recent-posts');
      const list = document.getElementById('recent-posts-list');
      list.innerHTML = posts.map(post => {
        const date = post.pub_date
          ? new Date(post.pub_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '';
        return `
          <article class="post-card">
            <p class="post-date mono">${date}</p>
            <h3><a href="${post.url}" target="_blank" rel="noopener">${escapeHtml(post.title)}</a></h3>
            <p class="excerpt">${escapeHtml(post.excerpt)}</p>
          </article>
        `;
      }).join('');
      container.hidden = false;
    })
    .catch(() => {});
</script>
</body>
</html>
